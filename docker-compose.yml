name: quartzdev-web
services:
  app:
    image: node:24.15.0-alpine
    restart: unless-stopped
    init: true
    ports:
      - '127.0.0.1:${APP_PORT:-3220}:3000'
    volumes:
      - .:/home/node/app
      - app_node_modules:/home/node/app/node_modules
    working_dir: /home/node/app
    command: sh -c 'corepack enable && corepack prepare pnpm@11.25.0 --activate && CI=true pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0'
    environment:
      SERVER_URL: ${SERVER_URL:-http://localhost:3220}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://127.0.0.1:3000/api/health", { signal: AbortSignal.timeout(5000) }).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 10s
      timeout: 10s
      start_period: 180s
      retries: 12

volumes:
  app_node_modules:
